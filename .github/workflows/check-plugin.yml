name: Test Suite

on:
  push:
    branches:
      - '**'          # Run on all branches
  pull_request:
    branches:
      - '**'          # Run on all PRs

jobs:
  gradle_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Run Gradle check
        run: ./gradlew check
